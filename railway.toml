# Railway deployment — https://docs.railway.com/reference/config-as-code
# Set Root Directory to this folder (AS_backend/AS_backend) in the Railway service settings.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Must match Dockerfile CMD — do not set migrate/seed in the Railway UI start command.
startCommand = "/usr/local/bin/entrypoint.sh"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
